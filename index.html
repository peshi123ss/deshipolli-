<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Deshipolli — Coming Soon</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f7f5;
      color: #171717;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 800px;
      padding: 30px 20px;
    }

    .logo {
      width: 190px;
      max-width: 70%;
      height: auto;
      display: block;
      margin: 0 auto 30px;
    }

    .badge {
      display: inline-block;
      padding: 9px 18px;
      border-radius: 50px;
      background: #171717;
      color: #ffffff;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 28px;
    }

    h1 {
      font-size: clamp(44px, 8vw, 82px);
      line-height: 0.98;
      font-weight: 800;
      letter-spacing: -4px;
      margin-bottom: 25px;
    }

    h1 span {
      color: #e63946;
    }

    p {
      max-width: 570px;
      margin: 0 auto;
      color: #666666;
      font-size: 18px;
      line-height: 1.7;
    }

    .facebook-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 30px;
      padding: 13px 22px;
      border-radius: 50px;
      background: #1877f2;
      color: #ffffff;
      text-decoration: none;
      font-size: 15px;
      font-weight: 700;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .facebook-btn:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    .facebook-icon {
      font-size: 20px;
      font-weight: bold;
    }

    .footer {
      margin-top: 50px;
      font-size: 13px;
      color: #999999;
    }

    @media (max-width: 600px) {
      .container {
        padding: 25px 18px;
      }

      .logo {
        width: 150px;
        margin-bottom: 25px;
      }

      .badge {
        font-size: 10px;
        padding: 8px 15px;
        margin-bottom: 22px;
      }

      h1 {
        font-size: clamp(42px, 13vw, 60px);
        letter-spacing: -2.5px;
      }

      p {
        font-size: 16px;
        line-height: 1.6;
      }

      .facebook-btn {
        margin-top: 25px;
      }

      .footer {
        margin-top: 40px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <!-- Deshipolli Logo -->
    <img
      src="./image/logo.png"
      alt="Deshipolli Logo"
      class="logo"
    />

    <div class="badge">
      COMING SOON
    </div>

    <h1>
      Something Great<br />
      <span>is Coming.</span>
    </h1>

    <p>
      We’re working behind the scenes to bring Deshipolli to life.
      Stay tuned — something exciting is on the way.
    </p>

    <!-- Facebook Button -->
    <a
      href="https://www.facebook.com/share/1A4dMoyazv/"
      target="_blank"
      rel="noopener noreferrer"
      class="facebook-btn"
    >
      <span class="facebook-icon">f</span>
      Follow us on Facebook
    </a>

    <div class="footer">
      © 2026 Deshipolli. All rights reserved.
    </div>

  </main>

</body>
</html>
